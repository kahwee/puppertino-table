version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Los_Angeles
    ignore:
      - dependency-name: react
        versions: ['>=20']
      - dependency-name: react-dom
        versions: ['>=20']
      - dependency-name: '@types/react'
        versions: ['>=20']
      - dependency-name: '@types/react-dom'
        versions: ['>=20']
    open-pull-requests-limit: 5
    groups:
      compatible-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
