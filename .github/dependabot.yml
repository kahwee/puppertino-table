version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      compatible-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Los_Angeles
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
