name: Shared verification
on:
  workflow_call:
    inputs:
      pages:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane: [quality, package, demo, stories-interactions, stories-table, stories-finder, stories-docs]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        if: (matrix.lane == 'demo' || startsWith(matrix.lane, 'stories-'))
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Keep OS dependencies current; cache hits skip the browser download.
      - if: (matrix.lane == 'demo' || startsWith(matrix.lane, 'stories-'))
        run: pnpm exec playwright install --with-deps chromium --no-shell
      - name: Select installed Chromium
        if: (matrix.lane == 'demo' || startsWith(matrix.lane, 'stories-'))
        run: pnpm exec node -e "const {chromium}=require('playwright'); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=' + chromium.executablePath() + '\n')"
      # Source checks are independent; benchmarks wait for the whole group.
      - parallel:
          - name: Lint
            if: matrix.lane == 'quality'
            run: pnpm lint
          - name: Type check
            if: matrix.lane == 'quality'
            run: pnpm typecheck
          - name: Unit and release tests
            if: matrix.lane == 'quality'
            run: pnpm test
      - name: Record collection benchmarks
        if: matrix.lane == 'quality'
        run: pnpm profile:collections
      - name: Upload collection benchmarks
        if: matrix.lane == 'quality'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-performance
          path: test-results/performance/
          if-no-files-found: error
      - name: Verify packed consumer and checked-in build
        if: matrix.lane == 'package'
        run: pnpm test:package && git diff --exit-code -- dist
      - name: Upload verified package
        if: matrix.lane == 'package'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-package-${{ github.run_id }}
          path: test-results/package/
          if-no-files-found: error
      - name: Build demo
        if: matrix.lane == 'demo'
        run: pnpm build:demo
      - name: Build Storybook
        if: startsWith(matrix.lane, 'stories-')
        run: pnpm build:storybook
      - name: Verify browser shard
        if: (matrix.lane == 'demo' || startsWith(matrix.lane, 'stories-'))
        env:
          PUPPERTINO_BROWSER_SUITE: ${{ matrix.lane }}
        run: pnpm exec tsx scripts/check-browser.ts
      - name: Verify hydration
        if: matrix.lane == 'demo'
        run: pnpm test:hydration
      - name: Upload browser evidence
        if: always() && (matrix.lane == 'demo' || startsWith(matrix.lane, 'stories-'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.lane }}
          path: |
            storybook-static/
            test-results/
      - name: Package Storybook for Pages
        if: inputs.pages && matrix.lane == 'stories-docs'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static/
