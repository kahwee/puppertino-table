name: Prepare npm package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Keep OS dependencies current; cache hits skip the browser download.
      - run: pnpm exec playwright install --with-deps chromium --no-shell
      - name: Select installed Chromium
        run: pnpm exec node -e "const {chromium}=require('playwright'); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=' + chromium.executablePath() + '\n')"
      # Same gates as pnpm check; every background exit status is collected.
      - name: Lint, type-check and unit tests
        run: |
          pnpm lint &
          task_0_pid=$!
          pnpm typecheck &
          task_1_pid=$!
          pnpm test &
          task_2_pid=$!
          status=0
          wait "$task_0_pid" || status=1
          wait "$task_1_pid" || status=1
          wait "$task_2_pid" || status=1
          exit "$status"
      - name: Build library, demo and Storybook
        run: |
          pnpm build &
          task_0_pid=$!
          pnpm build:demo &
          task_1_pid=$!
          pnpm build:storybook &
          task_2_pid=$!
          status=0
          wait "$task_0_pid" || status=1
          wait "$task_1_pid" || status=1
          wait "$task_2_pid" || status=1
          exit "$status"
      # Browser checks use built demo/Storybook and source; package checks own dist/prepack.
      - name: Verify browsers and packed consumers
        run: |
          pnpm test:browser &
          task_0_pid=$!
          pnpm test:package &
          task_1_pid=$!
          status=0
          wait "$task_0_pid" || status=1
          wait "$task_1_pid" || status=1
          exit "$status"
      - name: Verify checked-in build
        run: git diff --exit-code -- dist
      - name: Preview public npm publication
        run: npm publish test-results/package/*.tgz --dry-run --ignore-scripts --access public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-candidate
          path: test-results/package/
          if-no-files-found: error
