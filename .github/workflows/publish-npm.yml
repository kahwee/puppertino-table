name: Publish npm release
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: npm-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'kahwee/puppertino-table' && !github.event.release.draft && !github.event.release.prerelease && github.event.release.tag_name != 'v0.1.0'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      tarball: ${{ steps.release.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Validate stable tag, exact event SHA and package version
        id: release
        run: node scripts/release-guards.mjs validate-event
      - run: node --test tests/release.test.mjs
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Keep OS dependencies current; cache hits skip the browser download.
      - run: pnpm exec playwright install --with-deps chromium --no-shell
      - name: Select installed Chromium
        run: pnpm exec node -e "const {chromium}=require('playwright'); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PLAYWRIGHT_CHROMIUM_EXECUTABLE=' + chromium.executablePath() + '\n')"
      # Same gates as pnpm check; each native parallel group waits and propagates failures.
      - parallel:
          - name: Lint
            run: pnpm lint
          - name: Type-check
            run: pnpm typecheck
          - name: Unit and release tests
            run: pnpm test
      - parallel:
          - name: Build library
            run: pnpm build
          - name: Build demo
            run: pnpm build:demo
          - name: Build Storybook
            run: pnpm build:storybook
      # Browser checks use built demo/Storybook and source; package checks own dist/prepack.
      - parallel:
          - name: Browser verification
            run: pnpm test:browser
          - name: Packed-consumer verification
            run: pnpm test:package
      - run: git diff --exit-code -- dist
      - name: Verify packed artifact identity, file list and integrity
        id: pack
        run: node scripts/release-guards.mjs validate-packed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: test-results/package/
          if-no-files-found: error
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_INTEGRITY: ${{ needs.verify.outputs.integrity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.run_id }}
          path: release-candidate
      - name: Revalidate tag and downloaded candidate; check for existing version
        id: registry
        run: node scripts/release-guards.mjs registry-state release-candidate/pack.json
      - name: Publish verified tarball using npm trusted OIDC
        if: steps.registry.outputs.state == 'missing'
        env:
          TARBALL: ${{ needs.verify.outputs.tarball }}
        # Detached tag checkout is validated explicitly; lifecycle scripts never run here.
        run: pnpm publish "release-candidate/$TARBALL" --ignore-scripts --no-git-checks --access public --provenance --registry=https://registry.npmjs.org/
      - name: Verify exact registry version and artifact integrity
        run: node scripts/release-guards.mjs verify-registry release-candidate/pack.json
  consumer:
    needs: [verify, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Clean registry consumers with pinned React 19, types, rendering and CSS
        run: node scripts/check-package.mjs --from-registry
